name = "FLYWHEEL"
version = "0.1.0"
# All sources live in src/; each file is its own library.
srcDir = "src"
# Mathlib uses the module system; these files do not (yet), so do not warn on every import.
allowNonModules = true
# Every library, so a bare `lake build` checks the whole project.
# scripts/gen_index.py --check fails if a src/*.lean file is missing here.
defaultTargets = [
  "SVD",
  "KroneckerRearrangement",
  "MatrixNormRelations",
  "FrobeniusNorm",
  "CourantFischer",
  "WeylInequality",
  "SpectralNormGap",
  "CoherenceCharacterization",
  "TightBounds",
  "TruncatedSVDRank1",
  "FrobeniusUniqueness",
  "DavisKahan"
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "SVD"

[[lean_lib]]
name = "KroneckerRearrangement"

[[lean_lib]]
name = "MatrixNormRelations"

[[lean_lib]]
name = "FrobeniusNorm"

[[lean_lib]]
name = "CourantFischer"

[[lean_lib]]
name = "WeylInequality"

[[lean_lib]]
name = "SpectralNormGap"

[[lean_lib]]
name = "CoherenceCharacterization"

[[lean_lib]]
name = "TightBounds"

[[lean_lib]]
name = "TruncatedSVDRank1"

[[lean_lib]]
name = "FrobeniusUniqueness"

[[lean_lib]]
name = "DavisKahan"
