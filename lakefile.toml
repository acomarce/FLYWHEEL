name = "FLYWHEEL"
version = "0.1.0"
# All sources live in src/; each file is its own library.
srcDir = "src"
# Every library, so a bare `lake build` checks the whole project.
# scripts/gen_index.py --check fails if a src/*.lean file is missing here.
defaultTargets = [
  "SVD",
  "KroneckerRearrangement",
  "MatrixNormRelations",
  "FrobeniusNorm",
  "CourantFischer",
  "WeylInequality",
  "SpectralNormGap",
  "CoherenceCharacterization",
  "TightBounds",
  "TruncatedSVDRank1",
  "FrobeniusUniqueness",
  "DavisKahan",
  "Wedin"
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
# Pinned to a commit (the same one as lake-manifest.json), so `lake update` cannot move it.
# To bump: set rev to the new commit and lean-toolchain to Mathlib's, then `lake update mathlib`.
rev = "ccbef15ebdb41c2addfac682131f83c75904c3c1"

[[lean_lib]]
name = "SVD"

[[lean_lib]]
name = "KroneckerRearrangement"

[[lean_lib]]
name = "MatrixNormRelations"

[[lean_lib]]
name = "FrobeniusNorm"

[[lean_lib]]
name = "CourantFischer"

[[lean_lib]]
name = "WeylInequality"

[[lean_lib]]
name = "SpectralNormGap"

[[lean_lib]]
name = "CoherenceCharacterization"

[[lean_lib]]
name = "TightBounds"

[[lean_lib]]
name = "TruncatedSVDRank1"

[[lean_lib]]
name = "FrobeniusUniqueness"

[[lean_lib]]
name = "DavisKahan"

[[lean_lib]]
name = "Wedin"
