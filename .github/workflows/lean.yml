name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Lean and fetch Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      # defaultTargets in lakefile.toml lists every library, so a bare
      # `lake build` checks the whole project. The build is warning-free, so
      # --wfail fails it on any warning.
      - name: Build all libraries
        run: |
          set -o pipefail
          lake build --wfail 2>&1 | tee build.log

      - name: Check for sorry and axioms
        run: |
          if grep -n "declaration uses 'sorry'" build.log; then
            echo "::error::Build contains sorry"; exit 1
          fi
          if grep -nE "^\s*(axiom|sorry\b)|\bsorry\b|\badmit\b" --include=*.lean -r src; then
            echo "::error::Source contains axiom/sorry/admit"; exit 1
          fi

      # Every declaration may use only propext, Classical.choice and Quot.sound.
      - name: Check the axioms of every declaration
        run: lake env lean scripts/CheckAxioms.lean

      # Runs even when the build fails, so one CI run reports both.
      - name: Check docs/INDEX.md and lakefile targets are in sync
        if: ${{ !cancelled() }}
        run: python3 -I scripts/gen_index.py --check
